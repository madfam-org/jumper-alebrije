[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jumperkit"
version = "1.1.0"
description = "Looks, scenes and videos for KingKong Robotics' Jumper crab robot"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    # MuJoCo 3.10 is the last release with Intel-Mac wheels; newer ones work
    # wherever they install.
    "mujoco>=3.10",
    "onnxruntime>=1.17",
    "numpy",
    "scipy",
    "trimesh>=4.0",
    "rtree",
    "pillow",
    "imageio",
    "imageio-ffmpeg",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["jumperkit", "characters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = ["slow: builds packages or runs minutes of physics; run with `pytest -m slow`"]
